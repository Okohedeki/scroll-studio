[project]
name = "scroll-studio"
version = "0.1.0"
description = "Open-source engine for scroll-driven websites: AI film, artwork drawn on scroll, live 3D, product sequences, photo parallax and kinetic type, built locally from any inputs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "scikit-image>=0.21",
  "scipy>=1.11",
  "pillow>=10.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "jinja2>=3.1",
  "markdown>=3.5",
  "typer>=0.15",
  "rich>=13.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websocket-client>=1.7",
  "requests>=2.31",
  "huggingface_hub>=0.23",
  "mcp>=1.2",
  "playwright>=1.44",
]

[project.optional-dependencies]
# GPU / ML stages. torch must be the CUDA build for your driver: see docs/INSTALL.md.
ml = [
  "torch>=2.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "onnxruntime-gpu>=1.18",
  "rembg>=2.0.57",
]
vector = ["vtracer>=0.6"]
mesh = ["trimesh>=4.4", "pygltflib>=1.16"]
data = ["pandas>=2.2"]
audio = ["soundfile>=0.12"]
splat = ["gsplat>=1.3"]
dev = ["pytest>=8.0"]
all = ["scroll-studio[ml,vector,mesh,data,audio,dev]"]

[project.scripts]
studio = "engine.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["compile/templates/*", "compile/static/**/*", "backends/blender_scripts/**/*.py", "models.yaml", "themes.yaml"]
