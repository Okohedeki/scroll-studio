[project]
name = "scroll-studio"
version = "1.4.0"
description = "Open-source engine for scroll-driven websites: AI film, artwork drawn on scroll, live 3D, product sequences, photo parallax and kinetic type, built locally from any inputs."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "scikit-image>=0.21",
  "scipy>=1.11",
  "pillow>=10.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "jinja2>=3.1",
  "markdown>=3.5",
  "typer>=0.15",
  "rich>=13.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websocket-client>=1.7",
  "requests>=2.31",
  "huggingface_hub>=0.23",
  "mcp>=1.2,<3",            # 2.x renamed FastMCP to MCPServer; migrating is issue #83
  "playwright>=1.44",
  "tomli>=2.0; python_version < '3.11'",   # studio.toml: tomllib is in the standard library from 3.11
]

[project.optional-dependencies]
# GPU / ML stages. torch must be the CUDA build for your driver: see docs/INSTALL.md.
ml = [
  "torch>=2.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "onnxruntime-gpu>=1.18",
  "rembg>=2.0.57",
]
vector = ["vtracer>=0.6"]
# studio inspect --embed: a CLIP image embedding for the style-drift check (weights from the local Hugging Face cache)
embed = ["open_clip_torch>=2.24", "torch>=2.3"]
mesh = ["trimesh>=4.4", "pygltflib>=1.16"]
# site.product: STEP/STP through OpenCascade (cascadio), 3MF through trimesh
cad = ["cascadio>=0.1.1", "trimesh>=4.4", "lxml>=5.0"]
data = ["pandas>=2.2"]
audio = ["soundfile>=0.12"]
splat = ["gsplat>=1.3"]
# Pinned so a new release cannot turn CI red on its own; Dependabot raises them (and the actions) in a pull request.
dev = ["pytest>=8.0", "pytest-cov==6.0.0", "ruff==0.15.4", "build>=1.2", "setuptools>=68"]
all = ["scroll-studio[ml,vector,mesh,cad,data,audio,dev]"]

[project.scripts]
studio = "engine.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
# tests/test_packaging.py checks the built wheel against every tracked file under engine/, so a new kind of data file that
# is missing here fails a test instead of a user's install.
engine = [
  "compile/templates/*",
  "compile/static/**/*",
  "storyboard/edit/*.html",
  "trailer/*.html",
  "directions/*.j2",
  "styles/**/*",
  "backends/blender_scripts/**/*.py",
  "backends/comfy_nodes/**/LICENSE",
  "models.yaml",
  "themes.yaml",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["engine/compile/static", "ui/dist"]

[tool.ruff.lint]
# Real errors first: syntax errors and undefined names (E9, F63, F7, F82), then unused imports, redefinitions and unused
# locals. The flake8-bugbear rules (B) are not on yet: they raise about 270 findings that each need a judgement call.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.coverage.run]
source = ["engine"]
omit = [
  # a vendored GFPGAN architecture, run inside ComfyUI, with its own licence
  "engine/backends/comfy_nodes/scroll_studio_nodes/gfpgan_arch/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
