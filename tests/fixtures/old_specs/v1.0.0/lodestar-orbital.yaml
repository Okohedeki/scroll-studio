# Lodestar Orbital: an AI film (generated locally with LTX-2.3) scrubbed by scroll, with live telemetry.
# `video:` uses the film already rendered for this example. Delete that line to regenerate it from `shot:`
# (needs ComfyUI + the LTX-2.3 and Z-Image models, about 1-2 hours on an RTX 4090).
name: Lodestar Orbital
description: Launch, deploy and operate satellites with one team. From the pad to on-station.
theme:
  preset: night
nav:
  logo: M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z
  cta:
    label: Talk to mission ops
    href: '#book'
sections:
- id: launch
  type: film
  layout: overlay
  length: 7
  cue: Scroll to launch
  video: inputs/film.mp4
  hud:
    kind: telemetry
    fields:
    - label: Altitude
      unit: km
      to: 550
      curve: 1.6
      decimals: 1
    - label: Velocity
      unit: km/s
      to: 7.6
      curve: 1.25
      decimals: 2
    events:
    - at: 0.09
      label: Lift-off
    - at: 0.3
      label: Max-Q
    - at: 0.44
      label: Cloud break
    - at: 0.66
      label: Stage separation
    - at: 0.76
      label: Fairing separation
    - at: 0.86
      label: Array deploy
    clock:
      prefix: T
      start: -3
      end: 540
      zero: 0.083
  steps:
  - kicker: Lodestar Orbital
    title: Every mission starts <em>on the ground.</em>
    at:
    - 0.01
    - 0.13
  - kicker: Ascent
    title: Through the weather. <em>Past the noise.</em>
    at:
    - 0.22
    - 0.4
  - kicker: Separation
    title: When the fairing opens, <em>the work begins.</em>
    at:
    - 0.56
    - 0.72
  - kicker: On station
    title: Your satellite, <em>exactly where it belongs.</em>
    at:
    - 0.84
    - 0.99
  shot:
    blockout:
      preset: rocket-launch
    duration: 18
    fps: 24
    preview_res:
    - 1280
    - 720
    keyframes:
      model: z_image_turbo_bf16.safetensors
      text_encoder: qwen_3_4b_fp8_mixed.safetensors
      vae: ae.safetensors
      controlnet: Z-Image-Turbo-Fun-Controlnet-Union-2.1-2602-8steps.safetensors
      control_strength: 0.75
      steps: 8
      res:
      - 1536
      - 864
      seed: 11
      frames:
      - name: pad
        t: 0
        strength: 1.0
        prompt: Wide photograph of a rocket on a coastal launch pad at dawn. A tall slender white two-stage rocket with thin
          black bands stands beside a red steel lattice service tower, surrounded by four tall thin lightning masts. Wisps
          of white vapour vent from the rocket in the cool blue morning light, the first warm glow of sunrise on the horizon,
          flat marshland and low hangars around the pad, the ocean in the distance. Photoreal, documentary photography, crisp
          detail, natural colour, shot on a full-frame camera with a 30mm lens.
      - name: rise
        t: 4.67
        strength: 0.8
        control_strength: 0.85
        depth_blur: 0
        prompt: Photograph looking up at a slender white two-stage rocket with a plain smooth white cylindrical body, two
          thin black bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small
          dark trapezoid fins at the base, no wings, no delta fins, climbing on a brilliant pillar of orange and white flame
          in bright early-morning light. Clear deep blue sky above, a warm golden glow low on the horizon, the low sun lighting
          the white rocket body from the side, a long bright exhaust plume trailing down toward a billowing white smoke cloud
          far below. Daylight, not dusk, not night. Photoreal, IMAX documentary look, crisp clean detail.
      - name: clouds
        t: 8.0
        strength: 0.8
        control_strength: 0.85
        prompt: Photograph of a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black
          bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid
          fins at the base, no wings, no delta fins, rising straight up out of the top of a thick cumulus cloud deck on a
          single clean bright orange exhaust flame directly beneath its engines, the clouds parted smoothly around the flame,
          brilliant low sunlight above a sea of soft white clouds, the sky darkening to deep blue overhead. Nothing else in
          the sky, no debris. Photoreal, IMAX documentary look, crisp clean detail.
        depth_blur: 0
      - name: stagesep
        t: 12.33
        strength: 0.8
        control_strength: 0.85
        prompt: 'Photograph high above Earth: the upper part of a slender white two-stage rocket with a plain smooth white
          cylindrical body, two thin black bands, a clean plain white pointed nose cone with no windows, no dots and no markings,
          and four small dark trapezoid fins at the base, no wings, no delta fins, brightly sunlit, climbing against the black
          of space, and just below it the spent white first stage with its four small dark fins separating cleanly and falling
          away. Far below, the curved blue limb of Earth with swirling white clouds and a thin glowing blue atmosphere line.
          Harsh direct sunlight, deep black space, no stars, photoreal, NASA footage look, crisp clean detail.'
        depth_blur: 0
      - name: fairing
        t: 14.33
        strength: 0.8
        control_strength: 0.85
        prompt: 'Photograph in low Earth orbit: the white upper stage of a slender white rocket with thin black bands, against
          the black of space. Its plain white pointed nose fairing has split into two smooth white halves hinging open and
          drifting apart, revealing a satellite wrapped in gold foil inside. Far below, the curved blue limb of Earth with
          swirling white clouds and a thin glowing atmosphere line. Harsh direct sunlight, deep black space, no stars, photoreal,
          NASA footage look, crisp detail.'
      - name: satellite
        t: end
        strength: 0.9
        prompt: Photograph of a single communications satellite in orbit above Earth. A compact box-shaped body wrapped in
          crinkled gold foil with a small white antenna dish on top, and exactly two long rectangular dark-blue solar panel
          wings extending straight out to the left and to the right in one line, like a horizontal bar through the body, glinting
          in the sunlight. Below it the spent white cylindrical rocket upper stage, and one curved white fairing half drifting
          away on the right. Behind, the curved blue Earth with swirling white clouds and a thin glowing atmosphere line.
          Deep black space, no stars, harsh sunlight, photoreal, NASA footage look, crisp detail.
        control_strength: 0.9
    ltx:
      checkpoint: ltx-2.3-22b-distilled-fp8.safetensors
      text_encoder: gemma_3_12B_it_fp8_scaled.safetensors
      control_lora: ltx-2.3-22b-ic-lora-union-control-ref0.5.safetensors
      upscaler: ltx-2.3-spatial-upscaler-x2-1.1.safetensors
      res:
      - 1920
      - 1088
      upscale: false
      seed: 42
      control_strength: 1.0
      guide_strength: 0.6
      guide_blur: 4
      negative_prompt: low poly, untextured grey shapes, flat shading, blurry, smeared detail, cartoon, CGI, video game, text,
        logos, watermark, people, cuts, flicker, warped rocket, bent rocket, duplicate rockets
      segments:
      - id: pad
        range:
        - 0
        - 3
        guide_strength: 0.75
        guide_blur: 2
        prompt: 'The rocket is a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black
          bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid
          fins at the base, no wings, no delta fins. A continuous cinematic shot of a rocket launch at dawn on a coastal launch
          pad beside a red steel service tower and thin lightning masts, vapour venting in the cool blue light. The engines
          ignite in a blinding flash, a massive billowing cloud of white exhaust smoke erupts across the pad, and the rocket
          begins to lift off on a brilliant pillar of orange flame. Consistent warm dawn light throughout: low golden sun,
          the sky glowing orange near the horizon and clear deep blue above, never dark or night-time. Photoreal, IMAX documentary
          look, natural colour, clean crisp image, smooth tracking camera.'
        seed: 7
      - id: rise
        range:
        - 3
        - 6
        guide_strength: 0.75
        guide_blur: 2
        prompt: 'The rocket is a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black
          bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid
          fins at the base, no wings, no delta fins. A continuous cinematic shot, still in bright dawn light, as the camera
          tilts up and follows the brightly sunlit white rocket accelerating away from the launch pad on a long bright orange
          flame, the smoke cloud spreading below and the ground and coastline falling away. Consistent warm dawn light throughout:
          low golden sun, the sky glowing orange near the horizon and clear deep blue above, never dark or night-time. Photoreal,
          IMAX documentary look, natural colour, clean crisp image, smooth tracking camera.'
      - id: clouds
        range:
        - 6
        - 9
        guide_strength: 0.75
        guide_blur: 2
        prompt: 'The rocket is a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black
          bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid
          fins at the base, no wings, no delta fins. A continuous cinematic shot following the rocket as it climbs toward
          a thick layer of cumulus clouds and punches straight up through the cloud deck, emerging into dazzling low sunlight
          above a sea of soft white clouds. Consistent warm dawn light throughout: low golden sun, the sky glowing orange
          near the horizon and clear deep blue above, never dark or night-time. Photoreal, IMAX documentary look, natural
          colour, clean crisp image, smooth tracking camera.'
      - id: ascent
        range:
        - 9
        - 12
        guide_strength: 0.75
        guide_blur: 2
        prompt: The rocket is a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black
          bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid
          fins at the base, no wings, no delta fins. A continuous cinematic shot as the rocket climbs above a sea of clouds
          into a sky darkening from deep blue to black, the camera rising above it until the curved blue limb of Earth and
          a thin glowing atmosphere line appear far below, in harsh direct sunlight. Photoreal, NASA footage look, crisp clean
          detail, deep black space, no stars.
      - id: separation
        range:
        - 12
        - 15
        guide_strength: 0.75
        guide_blur: 2
        prompt: The rocket is a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black
          bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid
          fins at the base, no wings, no delta fins. A continuous cinematic shot high above Earth. The engine cuts off and
          the spent first stage separates cleanly and tumbles away toward Earth. Then the white nose fairing splits into two
          smooth halves that hinge open and drift apart, revealing a satellite wrapped in gold foil inside. Photoreal, NASA
          footage look, crisp clean detail, deep black space, no stars.
      - id: deploy
        range:
        - 15
        - 18
        guide_strength: 0.75
        guide_blur: 2
        prompt: The rocket is a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black
          bands, a clean plain white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid
          fins at the base, no wings, no delta fins. A continuous cinematic shot in orbit above the curved blue Earth with
          swirling white clouds. The gold-foil satellite pushes clear of the rocket and unfolds two long dark-blue solar panel
          wings that glint in the sun as the camera arcs slowly around it, the fairing halves drifting away. Photoreal, NASA
          footage look, crisp clean detail, deep black space, no stars.
      sampler: euler_cfg_pp
    subject: a slender white two-stage rocket with a plain smooth white cylindrical body, two thin black bands, a clean plain
      white pointed nose cone with no windows, no dots and no markings, and four small dark trapezoid fins at the base, no
      wings, no delta fins
- type: intro
  id: mission
  nav_label: Mission
  kicker: Mission
  title: One team from the pad <em>to on-station.</em>
  body: Lodestar books the ride, integrates your spacecraft, flies the launch and runs early operations until your satellite
    is healthy in its slot. You get one contract, one schedule and one team to call.
  button:
    label: Reserve a launch window
    href: '#book'
- type: features
  id: services
  nav_label: Services
  items:
  - tag: 01 / Launch
    title: Dedicated and rideshare
    body: Rides to LEO, SSO and GTO, matched to your mass, orbit and date.
  - tag: 02 / Integrate
    title: Payload integration
    body: Environmental testing, fit checks and fairing encapsulation in our clean rooms.
  - tag: 03 / Operate
    title: Early orbit operations
    body: Our ground network handles acquisition, checkout and orbit raising, around the clock.
- type: stats
  id: record
  nav_label: Record
  items:
  - value: '86'
    unit: flights
    label: Missions flown
  - value: '412'
    unit: sats
    label: Spacecraft delivered
  - value: '99'
    unit: '%'
    label: Deployed to target orbit
  - value: '14'
    unit: wks
    label: Contract to launch, typical
- type: timeline
  kicker: A typical mission
  title: Twelve weeks, <em>start to station.</em>
  items:
  - when: T-12 wks
    title: Mission design
    body: Orbit, rideshare slot and interfaces agreed.
  - when: T-4 wks
    title: Integration
    body: Testing and encapsulation in the fairing.
  - when: T-0
    title: Lift-off
    body: Launch from coastal pads in two hemispheres.
  - when: T+58 min
    title: Deployment
    body: Separation confirmed, first signal acquired.
  - when: T+30 days
    title: On station
    body: Checkout complete, handover to your team.
- type: cta
  id: book
  kicker: Next window
  title: Your payload.<br><em>Our countdown.</em>
  button:
    label: Reserve a launch window
    href: '#'
  background: scene:launch
footer:
  left: © Lodestar Orbital. A concept site.
  right: Film generated locally with LTX-2.3
