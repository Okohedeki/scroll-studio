  reason: "footer text is #28180c on #2e1d10 (1.05:1), the '3 of 3' kicker is 1.03:1 and the fixed scene counter is dark on the dark rim, 1.2:1 (reached by axe once the kitchen page grew, #138)"
- rule: color-contrast
  look: style-smears
  selector: 'sa-head__cta|sa-cap--badge|sa-folio|sa-key__no|sa-btn--hot'
  reason: "white on hot pink is 3.3:1 (header button, badge, the cta's big button); the folios and key numbers are 2.8-3.7:1"
- rule: button-name
  look: style-split-flap
  selector: 'sf-sound'
  reason: "the phone board's sound toggle (.sf-sound) is a button with no accessible name"
- rule: color-contrast
  look: style-stop-motion
  selector: 'sm-head__cta'
  reason: "the header button is 3.84:1 (cream on orange)"

# --- found by axe-core 4.14 (#107)
- rule: label-content-name-mismatch
  look: style-comic-book
  selector: 'cb-cornerbox'
  reason: "the issue-number corner link reads '#1 Free' but its aria-label is 'Kitchen Sink, issue 1, back to the cover': the label should start with the visible text"
- rule: label-content-name-mismatch
  look: style-retro-vhs
  selector: 'vhs-key|vhs-rk'
  reason: "the VCR keys and remote buttons show REW, F.FWD, CH and TRK but their aria-labels don't contain those words: the labels should include the visible text"
- rule: color-contrast
  look: style-smears
  selector: 'sa-print__cap'
  reason: "gallery caption emphasis is #45ddff on white, 1.61:1"
