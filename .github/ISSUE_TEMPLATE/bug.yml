name: Bug
description: Something builds wrong, renders wrong or breaks.
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Pictures help for anything visual.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: The smallest site.yaml that shows it
      description: Cut your spec down to the section that breaks. Remove anything private.
      render: yaml
  - type: textarea
    id: log
    attributes:
      label: Build output or error
      render: text
  - type: input
    id: version
    attributes:
      label: Scroll Studio version or commit
      placeholder: "1.4.0, or git rev-parse --short HEAD"
    validations:
      required: true
  - type: textarea
    id: machine
    attributes:
      label: Machine
      description: OS, GPU, and what `studio doctor` says is available (for render problems).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in the engine, if you know. Leave it if you're not sure.
      multiple: true
      options:
        - Runtime (how built pages scroll and play)
        - Spec (site.yaml fields and validation)
        - Compiler, templates and themes
        - Scenes and builders
        - Styles
        - Models, ComfyUI and Blender
        - CLI
        - MCP tools
        - Studio app
        - Docs
        - Examples
        - Not sure
