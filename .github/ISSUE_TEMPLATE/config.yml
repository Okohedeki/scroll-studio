blank_issues_enabled: false
contact_links:
  - name: Question or help
    url: https://github.com/Okohedeki/designai/discussions/categories/q-a
    about: How do I...? Is this a bug? Ask in Discussions first (SUPPORT.md).
  - name: Idea or proposal
    url: https://github.com/Okohedeki/designai/discussions/categories/ideas
    about: Talk an idea through before it becomes an issue; core designs become RFCs (docs/rfcs).
  - name: Security problem
    url: https://github.com/Okohedeki/designai/security/advisories/new
    about: Report vulnerabilities privately, never in a public issue (SECURITY.md).
  - name: How to contribute
    url: https://github.com/Okohedeki/designai/blob/main/CONTRIBUTING.md
    about: Every pull request needs an accepted issue. The ground rules, the rules per area and how pull requests are checked.
