# The checks every change to main must pass. Branch protection requires the `tests` job (Linux); the others are `lint`
# (ruff and the repository hygiene tests, fast). No GPU and no models: the suite covers the spec, the planners, the
# compiler, the layout snapshots of every example and the conformance of every theme preset and style. Tests that need
# ffmpeg or node run here too; GPU stages are not exercised.
# Every action is pinned to a full commit SHA (the comment is its version); Dependabot raises them in a pull request.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff (the version pinned in pyproject.toml) and pytest
        run: |
          RUFF=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev'] if d.startswith('ruff')))")
          python -m pip install pytest "$RUFF"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Repository hygiene (large and misplaced files, secrets, machine paths)
        run: python -m pytest -q -p no:cacheprovider tests/test_repo_hygiene.py tests/test_no_local_paths.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Python packages
        # the CPU build of torch: the frozen-moment warp, layers and deep zoom run their tests on the CPU
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Node packages
        run: npm ci
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
