# The checks every change to main must pass. Branch protection requires the `tests` job (Linux with coverage floors);
# the others are `lint`, `platforms` (other Pythons and operating systems) and `install` (the built wheel runs from a
# clean virtualenv). No GPU and no models: the suite covers the spec, the planners, the compiler, the layout snapshots
# of every example and the conformance of every theme preset and style. Tests that need ffmpeg or node run here too;
# GPU stages are not exercised.
# Every action is pinned to a full commit SHA (the comment is its version); Dependabot raises them in a pull request.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff (the version pinned in pyproject.toml) and pytest
        run: |
          RUFF=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev'] if d.startswith('ruff')))")
          python -m pip install pytest "$RUFF"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Repository hygiene (large and misplaced files, secrets, machine paths)
        run: python -m pytest -q -p no:cacheprovider tests/test_repo_hygiene.py tests/test_no_local_paths.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Python packages
        # the CPU build of torch: the frozen-moment warp, layers and deep zoom run their tests on the CPU
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Node packages
        run: npm ci
      - name: Tests with coverage
        run: >
          python -m pytest -q -p no:cacheprovider --cov
          --cov-report=json:coverage.json --cov-report=xml:coverage.xml --cov-report=term:skip-covered
      - name: Coverage floors
        # the total and each area in tests/coverage_floors.json; also written to the job summary
        run: python tools/check_coverage.py coverage.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  platforms:
    # The same suite without the coverage run, on the other Pythons and operating systems. Linux is required (`tests`);
    # these become required once they are green and stable.
    name: platforms (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true      # the tests that need ffmpeg skip with a reason when it is missing
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true      # as above
        run: choco install ffmpeg --no-progress -y
      - name: Say so when ffmpeg is missing
        shell: bash
        run: |
          command -v ffmpeg >/dev/null || echo "::warning::ffmpeg is not installed on this runner, so the tests that need it are skipped"
      - name: Python packages (CPU torch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
          pip install -e ".[dev]"
      - name: Node packages
        run: npm ci
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  install:
    # What a user gets from `pip install`: the wheel (and sdist) built here, installed into a virtualenv outside the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist
      - name: Install the wheel into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
      - name: The commands run
        # from outside the checkout, so nothing can be picked up from the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/studio" --help
          "$RUNNER_TEMP/clean/bin/studio" schema | "$RUNNER_TEMP/clean/bin/python" -c "import json, sys; json.load(sys.stdin)"
          "$RUNNER_TEMP/clean/bin/studio" doctor
      - name: Everything is packaged, and every example compiles from the installed package
        working-directory: ${{ runner.temp }}
        run: >
          "$RUNNER_TEMP/clean/bin/python" -I "$GITHUB_WORKSPACE/tools/install_check.py"
          --checkout "$GITHUB_WORKSPACE" --sdist "$GITHUB_WORKSPACE"/dist/*.tar.gz
