# The checks every change to main must pass (branch protection requires the `tests` job). No GPU and no models: the
# suite covers the spec, the planners, the compiler, the layout snapshots of every example and the conformance of every
# theme preset and style. Tests that need ffmpeg or node run here too; GPU stages are not exercised.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Python packages
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Node packages
        run: npm ci
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
