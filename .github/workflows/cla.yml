# Contributor Licence Agreement (CLA.md). On a contributor's first pull request a bot asks them to sign by commenting;
# signatures are kept in signatures/cla.json on the `cla-signatures` branch of this repository. The maintainer and bots
# are on the allowlist. A pull request is merged only once every author has signed (see CONTRIBUTING.md).
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Okohedeki/scroll-studio/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Okohedeki,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for contributing to Scroll Studio. Before this can be merged, please read the
            [Contributor Licence Agreement](https://github.com/Okohedeki/scroll-studio/blob/main/CLA.md) and sign it by
            commenting on this pull request with exactly the sentence below. You only need to sign once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
