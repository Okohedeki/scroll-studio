# Weekly version updates, grouped so they arrive as a few pull requests rather than dozens. Security updates are
# separate and immediate (repository settings). A new release has to be a week old before Dependabot proposes it,
# which keeps freshly published (possibly hijacked) versions out.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, "area: packaging"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, "area: runtime"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      runtime-and-ui:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, "area: ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types: [major, minor, patch]
