# Multiplane: Disney's multiplane camera (Snow White, Pinocchio, Bambi). See docs/styles/styles-30-31.md section 2
# for the research.
label: Multiplane
about: >-
  A stack of painted glass plates at real depths under one camera, and scrolling is the crank. Between sections the camera trucks in through the stack, near plates and the words pass the lens and the next stack emerges from the mist, with the focus pulled to the plate the words are on. Inside a list a foreground plate of trunks sweeps past at speed to change the words. The pointer slides the camera and rests to pull focus.
mode: dark
scene_blocks: []   # drawn its own way as steps inside a scene; other types use the default markup there
colors:
  bg: '#14111f'
  bg2: '#1b1729'
  ink: '#f6ecd9'
  accent: '#f0a05c'
  accent2: '#9db6d9'
  accent_ink: '#2a1608'
  accent_text: '#f6ecd9'
fonts:
  display: Cormorant Garamond
  body: Lora
  mono: DM Mono
font_axes:
  Cormorant Garamond: "ital,wght@0,400..700;1,400..700"
  Lora: "ital,wght@0,400..700;1,400..700"
  DM Mono: "wght@400;500"
display_weight: 500
radius: 999px
# What a brand (theme.from) cannot change here: the dark room its CSS is drawn for
requires:
  mode: dark
