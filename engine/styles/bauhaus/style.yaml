label: Bauhaus
about: One pinned poster that recomposes as you scroll. A red circle, a black bar, a yellow triangle and a blue square slide, rotate and re-dock into a new designed layout for every section; the circle that was the sun becomes the pie chart and finally the button.
mode: light
colors:
  bg: '#efe8da'
  bg2: '#e6ddca'
  ink: '#111111'
  accent: '#be1e2d'
  accent2: '#1f4e9c'
  accent_ink: '#ffffff'
  accent_text: '#a51a27'
fonts:
  display: Jost
  body: Jost
  mono: Jost
font_axes:
  Jost: "ital,wght@0,100..900;1,100..900"
display_weight: 700
radius: 0px
