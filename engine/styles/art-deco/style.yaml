# Art deco: an opening night. See docs/styles/styles-16-21.md section 4 for the research.
label: Art deco
about: An opening night. Scroll parts gold-lacquered doors on the centre axis to reveal a spotlit headline under a fanning sunburst; every scene unfolds symmetrically from the centre, features are dealt in mirrored pairs, stats are billed on a marquee with chasing bulbs, an elevator dial sweeps floor by floor, and doors close and reopen between scenes until the ADMIT ONE invitation.
