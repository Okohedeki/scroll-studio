  mono: Space Mono
  chapter: Luckiest Guy
font_axes:
  Bangers: ""
  Comic Neue: "ital,wght@0,400;0,700;1,700"
  Space Mono: "ital,wght@0,400;0,700;1,400"
  Luckiest Guy: ""
display_weight: 400
radius: 0px
