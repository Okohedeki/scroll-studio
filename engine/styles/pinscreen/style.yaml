# Pinscreen: Alexeieff and Parker's board of pins (1933). See docs/styles/styles-22-23.md section 22 for the research.
label: Pinscreen
about: One lamp-lit board of pins holds the whole site, and every plate is a full pinscreen picture, deep blacks to soft greys, with sculpted numerals, the phone and your art modelled by the light. Scroll sends a wave through the board, a wall of pins that rolls out and leaves the next picture rippling behind it; headlines stay crisp in ivory over the pins, the mouse moves the lamp and pressing draws lines the board slowly pushes back.
mode: dark
cuts: false   # the style plays its own hand-over between sections: `transition:` is ignored (see engine/styles/README.md)
colors:
  bg: '#121212'
  bg2: '#1b1b1b'
  ink: '#efe9dd'
  accent: '#efe9dd'
  accent2: '#c9c2b4'
  accent_ink: '#121212'
  accent_text: '#efe9dd'
fonts:
  display: Yeseva One
  body: Spectral
  mono: Courier Prime
font_axes:
  Yeseva One: ""
  Spectral: "ital,wght@0,300;0,400;0,500;0,600;1,300;1,400"
  Courier Prime: "ital,wght@0,400;0,700;1,400"
display_weight: 400
radius: 0px
# What a brand (theme.from) cannot change here: the dark room its CSS is drawn for
requires:
  mode: dark
