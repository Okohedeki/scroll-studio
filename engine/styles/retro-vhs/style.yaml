# Retro VHS: tokens and fonts for theme.style: retro-vhs. The page is a tape playing on a 4:3 TV in a dark room:
# scrolling is the transport (PLAY, PAUSE, SEARCH, REW on the on-screen display), sections arrive mistracked and lock.
label: Retro VHS
about: A tape on a 4:3 TV. Scroll is the transport, so the on-screen display reads PLAY, PAUSE, SEARCH or REW with a running tape counter; every section arrives mistracked and locks, nav jumps are channel changes, and the call to action is ● REC.
mode: dark
scene_blocks: [product, stats, quote, faq, cta]   # drawn its own way as steps inside a scene; other types use the default markup there
colors:
  bg: '#121016'
  bg2: '#0b0a0e'
  ink: '#f4f4f4'
  accent: '#ff3b3b'
  accent2: '#3cff7a'
  accent_ink: '#14000a'
  accent_text: '#ff6b6b'
fonts:
  display: VT323
  body: IBM Plex Mono
  mono: VT323
  hand: Permanent Marker
font_axes:
  VT323: ""
  IBM Plex Mono: "ital,wght@0,400;0,500;0,600;1,400"
  Permanent Marker: ""
display_weight: 400
radius: 0px
# What a brand (theme.from) cannot change here: the dark room its CSS is drawn for, and its display, mono faces (the on-screen display is a VCR's)
requires:
  mode: dark
  fonts: { display: VT323, mono: VT323 }
