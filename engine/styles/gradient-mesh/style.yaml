# Gradient mesh: weather. See docs/styles/styles-11-15.md section 1 for the research.
label: Gradient mesh
about: Weather. One slowly breathing colour field behind the page (a single WebGL canvas) that bookends the hero and the closing band, wakes in small patches on hover, ruffles when you scroll fast and quietly changes hue from chapter to chapter; around it, calm editorial whitespace. Nothing pins, snaps or cuts.
mode: light
colors:
  bg: '#f6f9fc'
  bg2: '#ffffff'
  ink: '#0a2540'
  accent: '#635bff'
  accent2: '#7a73ff'
  accent_ink: '#ffffff'
  ink2: '#425466'
  ink3: '#53667a'
fonts:
  display: Inter Tight
  body: Inter
  mono: Inter
  accent: Instrument Serif
font_axes:
  Inter Tight: "ital,wght@0,100..900;1,100..900"
  Inter: "ital,opsz,wght@0,14..32,100..900;1,14..32,100..900"
  Instrument Serif: "ital@0;1"
display_weight: 600
radius: 999px
