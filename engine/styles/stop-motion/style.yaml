# Stop-motion: tokens and fonts for theme.style: stop-motion. See engine/styles/README.md for the contract and
# docs/styles/styles-28-29.md section 1 for the research.
label: Stop-motion
about: "A miniature set shot one exposure at a time. The page only moves while you scroll, and each notch of scroll is one frame on the animator's counter: set pieces are felt, card and clay, nudged into place in jumpy poses with their surfaces boiling, nothing moves between exposures, and between sections the set is struck and dressed again. Poke a puppet and it hops; switch on the onion skin to see the last frame."
mode: dark
colors:
  bg: '#0b0705'
  bg2: '#14100b'
  ink: '#f4e6c8'
  accent: '#d2561f'
  accent2: '#e0a526'
  accent_ink: '#000000'
  accent_text: '#d2561f'
fonts:
  display: Fredoka
  body: Jost
  mono: Gaegu
  counter: Special Elite
font_axes:
  Fredoka: "wght@300..700"
  Jost: "ital,wght@0,300..800;1,300..800"
  Gaegu: "wght@400;700"
  Special Elite: ""
display_weight: 600
radius: 6px
