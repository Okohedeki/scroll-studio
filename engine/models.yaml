# Every model Scroll Studio can use. ComfyUI models go in ComfyUI's model folders (see docs/INSTALL.md);
# Hugging Face models download automatically into <model_dir>/hf on first use.
# Licences belong to the model authors and are NOT covered by Scroll Studio's licence (AGPL-3.0). Check before commercial use.

comfyui:
  - name: LTX-2.3 22B distilled (fp8)
    file: checkpoints/ltx-2.3-22b-distilled-fp8.safetensors
    source: https://huggingface.co/Lightricks/LTX-2.3
    size_gb: 27
    vram_gb: 20
    licence: LTX-2 Community License
    used_by: [film, cinemagraph]
  - name: Gemma 3 12B text encoder (fp8)
    file: text_encoders/gemma_3_12B_it_fp8_scaled.safetensors
    source: https://huggingface.co/Comfy-Org/ltx-2
    size_gb: 13
    licence: Gemma Terms of Use
    used_by: [film, cinemagraph]
  - name: LTX-2.3 IC-LoRA Union Control
    file: loras/ltx-2.3-22b-ic-lora-union-control-ref0.5.safetensors
    source: https://huggingface.co/Lightricks/LTX-2.3
    size_gb: 1.2
    licence: LTX-2 Community License
    used_by: [film]
  - name: LTX-2.3 spatial upscaler x2
    file: latent_upscale_models/ltx-2.3-spatial-upscaler-x2-1.1.safetensors
    source: https://huggingface.co/Lightricks/LTX-2.3
    size_gb: 1
    licence: LTX-2 Community License
    used_by: [film (upscale)]
  # Wan 2.2 A14B (`video_model: wan`): a second video model (16 fps, ~1280x720), at about the same VRAM as LTX.
  # fp8 14B experts (~14 GB each) on a 24 GB RTX 4090: ComfyUI keeps one expert on the GPU and swaps to the other
  # half-way through sampling (needs ~32 GB of free system RAM to hold the idle one). `wan:` names the key in
  # engine/backends/comfy.py WAN; override the file name in studio.toml [wan] when yours differs or sits in a
  # subfolder (doctor and the engine also find a moved file by its base name through ComfyUI's model list).
  - name: Wan 2.2 I2V A14B high-noise expert (fp8)
    file: diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    wan: i2v_high
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    size_gb: 14.3
    vram_gb: 16
    licence: Apache-2.0
    used_by: [film beats, cinemagraph, theme.art (video_model wan)]
  - name: Wan 2.2 I2V A14B low-noise expert (fp8)
    file: diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    wan: i2v_low
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    size_gb: 14.3
    vram_gb: 16
    licence: Apache-2.0
    used_by: [film beats, cinemagraph, theme.art (video_model wan)]
  - name: Wan 2.2 Fun Control A14B high-noise expert (fp8)
    file: diffusion_models/wan2.2_fun_control_high_noise_14B_fp8_scaled.safetensors
    wan: control_high
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/diffusion_models/wan2.2_fun_control_high_noise_14B_fp8_scaled.safetensors
    size_gb: 14.3
    vram_gb: 16
    licence: Apache-2.0
    used_by: [film takes (video_model wan)]
  - name: Wan 2.2 Fun Control A14B low-noise expert (fp8)
    file: diffusion_models/wan2.2_fun_control_low_noise_14B_fp8_scaled.safetensors
    wan: control_low
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/diffusion_models/wan2.2_fun_control_low_noise_14B_fp8_scaled.safetensors
    size_gb: 14.3
    vram_gb: 16
    licence: Apache-2.0
    used_by: [film takes (video_model wan)]
  # Optional, NOT installed by default: the Uni3C camera controlnet for `camera.backend: uni3c` (keyed camera moves on moving
  # beats). The engine fails with this file name, URL and folder when you pick that backend without it.
  - name: Uni3C camera controlnet (Wan 2.1 I2V 14B)
    file: model_patches/Wan21_Uni3C_controlnet_fp16.safetensors
    uni3c: true
    source: https://huggingface.co/Kijai/WanVideo_comfy/blob/main/Wan21_Uni3C_controlnet_fp16.safetensors
    size_gb: 2
    licence: Apache-2.0
    used_by: [film beats (camera.backend uni3c)]
  - name: UMT5-XXL text encoder (fp8)
    file: text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    wan: text_encoder
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    size_gb: 6.7
    licence: Apache-2.0
    used_by: [video_model wan]
  - name: Wan 2.1 VAE
    file: vae/wan_2.1_vae.safetensors
    wan: vae
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/vae/wan_2.1_vae.safetensors
    size_gb: 0.25
    licence: Apache-2.0
    used_by: [video_model wan]
  - name: Wan 2.2 I2V lightx2v 4-step LoRA, high noise
    file: loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    wan: lora_high
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    size_gb: 1.2
    licence: Apache-2.0
    used_by: [video_model wan (wan.quality fast, the default)]
  - name: Wan 2.2 I2V lightx2v 4-step LoRA, low noise
    file: loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
    wan: lora_low
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/blob/main/split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
    size_gb: 1.2
    licence: Apache-2.0
    used_by: [video_model wan (wan.quality fast, the default)]
  - name: Z-Image Turbo (bf16)
    file: diffusion_models/z_image_turbo_bf16.safetensors
    source: https://huggingface.co/Comfy-Org/z_image_turbo
    size_gb: 12
    vram_gb: 13
    licence: Apache-2.0
    used_by: [film (keyframes), "any image `generate:`"]
  - name: Qwen3 4B text encoder (fp8)
    file: text_encoders/qwen_3_4b_fp8_mixed.safetensors
    source: https://huggingface.co/Comfy-Org/z_image_turbo
    size_gb: 5
    licence: Apache-2.0
    used_by: [film, "image `generate:`"]
  - name: Flux VAE (ae)
    file: vae/ae.safetensors
    source: https://huggingface.co/Comfy-Org/z_image_turbo
    size_gb: 0.3
    licence: Apache-2.0
    used_by: [film, "image `generate:`"]
  - name: Z-Image Turbo Fun ControlNet Union 2.1
    file: model_patches/Z-Image-Turbo-Fun-Controlnet-Union-2.1-2602-8steps.safetensors
    source: https://huggingface.co/alibaba-pai/Z-Image-Turbo-Fun-Controlnet-Union-2.1
    size_gb: 3
    licence: Apache-2.0
    used_by: [film (keyframes)]
  # SeedVR2 (custom node ComfyUI-SeedVR2_VideoUpscaler): `beat_restore`, `take.restore`, `shot.upscale`, and one image
  # at a time for a frozen moment (`freeze.upscale`). The node downloads both files into models/SEEDVR2 on first use.
  - name: SeedVR2 7B sharp (fp8)
    file: SEEDVR2/seedvr2_ema_7b_sharp_fp8_e4m3fn.safetensors
    source: https://huggingface.co/numz/SeedVR2_comfyUI
    size_gb: 8
    vram_gb: 16
    licence: Apache-2.0
    used_by: [film (restore, upscale), "frozen moments (freeze.upscale)"]
  - name: SeedVR2 VAE (fp16)
    file: SEEDVR2/ema_vae_fp16.safetensors
    source: https://huggingface.co/numz/SeedVR2_comfyUI
    size_gb: 0.5
    licence: Apache-2.0
    used_by: [film (restore, upscale), "frozen moments (freeze.upscale)"]

  # reveal (scroll-driven colour) and faces: restore. Installed by `studio setup-comfy` (custom nodes + GFPGAN) and `studio
  # doctor` checks them; the SAM 2.1 and Florence-2 weights download into ComfyUI/models on first use. Checked against the
  # engine's own nodes: ComfyUI-segment-anything-2 (kijai, Apache-2.0, pinned 0c35fff), ComfyUI-Florence2 (kijai, MIT, 9ece3de)
  # and scroll_studio_nodes (this repo, engine/backends/comfy_nodes/).
  - name: SAM 2.1 Hiera Large (fp16)
    file: sam2/sam2.1_hiera_large-fp16.safetensors
    source: https://huggingface.co/Kijai/sam2-safetensors
    size_gb: 0.45
    vram_gb: 4
    licence: Apache-2.0 (Meta)
    used_by: [film reveal (tracker large, the default), cinemagraph, "type in the world: surface type and a behind prompt"]
    node: sam2
  - name: SAM 2.1 Hiera Base+ (fp16)
    file: sam2/sam2.1_hiera_base_plus-fp16.safetensors
    source: https://huggingface.co/Kijai/sam2-safetensors
    size_gb: 0.16
    vram_gb: 3
    licence: Apache-2.0 (Meta)
    used_by: [film reveal (tracker base_plus)]
    optional: true
  - name: Florence-2 large
    file: LLM/Florence-2-large/model.safetensors
    source: https://huggingface.co/microsoft/Florence-2-large
    size_gb: 1.5
    vram_gb: 3
    licence: MIT (Microsoft)
    used_by: [film reveal (a region's prompt -> a box), cinemagraph, "type in the world (a prompt for a surface or what the type sits behind)"]
    node: florence2
  - name: GFPGAN v1.4
    file: facerestore_models/GFPGANv1.4.pth
    source: https://github.com/TencentARC/GFPGAN/releases/tag/v1.3.4
    size_gb: 0.35
    vram_gb: 2
    licence: Apache-2.0 (Tencent ARC)
    used_by: [faces restore]
    node: gfpgan
  # facexlib's RetinaFace detector (detection_Resnet50_Final.pth, 110 MB) and ParseNet face mask (parsing_parsenet.pth, 85 MB)
  # download into facexlib's own weights folder the first time `faces: restore` runs (MIT). CodeFormer is deliberately not
  # used: its licence is non-commercial.

huggingface:
  - name: Depth Anything V2 Small
    repo: depth-anything/Depth-Anything-V2-Small-hf
    size_gb: 0.1
    licence: Apache-2.0
    used_by: [parallax (default), "frozen moments (freeze.depth_model, default)", "type in the world (film depth_model, default)"]
  - name: Depth Anything V2 Base / Large
    repo: depth-anything/Depth-Anything-V2-Large-hf
    size_gb: 1.3
    licence: CC-BY-NC-4.0 (non-commercial)
    used_by: [parallax (depth_model: base | large), "frozen moments (freeze.depth_model: base | large)", "type in the world (film depth_model: base | large)"]

  - name: OpenCLIP ViT-H/14 (LAION-2B)
    repo: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
    size_gb: 3.9
    licence: MIT
    used_by: ["studio inspect --embed (optional: style drift as an embedding distance; CPU; never downloaded automatically)"]

optional:
  - name: BiRefNet / rembg
    note: subject cut-outs (pip extra `ml`), planned for artwork and sequence-from-photos
    licence: MIT
  - name: Hunyuan3D-2 or TRELLIS
    note: image -> 3D model for `sequence` from product photos (planned)
    licence: Tencent Hunyuan Community (region limits) / MIT
  - name: RIFE 4.x
    note: frame interpolation for smoother sequences and the planned `morph` type
    licence: MIT
  - name: MusicGen (stereo large)
    note: optional music beds for recordings
    licence: CC-BY-NC-4.0 (non-commercial)
