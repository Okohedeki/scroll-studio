# Styles: a whole look in one word. A site picks one with theme.style; it sets the colours, fonts and corner
# radius (under anything site.yaml overrides), adds the look's stylesheet (engine/styles/<name>.css) and, where
# the look moves, a runtime effect (runtime/src/fx/<fx>.ts). Every style works with every section type.
#
#   bg:   canvas background drawn behind hero, intro and CTA panels (particles, wireframe, ascii)
#   text: how headings arrive (flap = split-flap board, kinetic = letters, scramble = decoding characters)

particles:
  label: Particles
  about: A slow field of connected points drifting behind the copy; the field stirs when you scroll.
  mode: dark
  colors: { bg: "#06070d", bg2: "#0c0e18", ink: "#eef1ff", accent: "#7aa2ff", accent2: "#b8ccff", accent_ink: "#050816" }
  fonts: { display: "Sora", body: "Inter", mono: "JetBrains Mono" }
  display_weight: 500
  radius: 999px
  fx: { bg: particles }

liquid-morph:
  label: Liquid morph
  about: Soft blobs that melt into each other behind the page, buttons that wobble like a drop.
  mode: dark
  colors: { bg: "#0b0614", bg2: "#140b22", ink: "#f6efff", accent: "#ff5fa2", accent2: "#ffa0c8", accent_ink: "#1a0610" }
  fonts: { display: "Syne", body: "Manrope", mono: "DM Mono" }
  display_weight: 700
  radius: 999px

holographic:
  label: Holographic
  about: Iridescent foil on the headlines and cards, shifting with the scroll and the pointer.
  mode: dark
  colors: { bg: "#08080c", bg2: "#101018", ink: "#f4f4fb", accent: "#9f8cff", accent2: "#7ff0e0", accent_ink: "#0b0820" }
  fonts: { display: "Unbounded", body: "Inter", mono: "JetBrains Mono" }
  display_weight: 500
  radius: 18px
  fx: { pointer: true }

neon-glow:
  label: Neon glow
  about: Tubes of light on a dark wall; headlines buzz on as they arrive.
  mode: dark
  colors: { bg: "#07040d", bg2: "#0e0818", ink: "#fbeaff", accent: "#ff2bd6", accent2: "#3df5ff", accent_ink: "#16031a" }
  fonts: { display: "Tilt Neon", body: "Outfit", mono: "Space Mono" }
  display_weight: 400
  radius: 999px

wireframe-3d:
  label: Wireframe 3D
  about: A wireframe landscape rolls under the copy as you scroll, like an old flight computer.
  mode: dark
  colors: { bg: "#03070a", bg2: "#071016", ink: "#d8fff4", accent: "#38f2b4", accent2: "#9dffe0", accent_ink: "#021a12" }
  fonts: { display: "Space Grotesk", body: "Space Grotesk", mono: "JetBrains Mono" }
  display_weight: 500
  radius: 2px
  fx: { bg: wireframe }

glassmorphism:
  label: Glassmorphism
  about: Frosted panels floating over bright colour fields.
  mode: dark
  colors: { bg: "#0d1030", bg2: "#141846", ink: "#ffffff", accent: "#ffd166", accent2: "#ffe39f", accent_ink: "#231a00" }
  fonts: { display: "Plus Jakarta Sans", body: "Plus Jakarta Sans", mono: "DM Mono" }
  display_weight: 700
  radius: 22px

kinetic-type:
  label: Kinetic type
  about: Huge condensed headlines whose letters rise one by one and lean into a fast scroll.
  mode: light
  colors: { bg: "#f1efe9", bg2: "#e6e2d8", ink: "#111111", accent: "#ff3d00", accent2: "#ff7a4d", accent_ink: "#ffffff" }
  fonts: { display: "Anton", body: "Inter", mono: "JetBrains Mono" }
  display_weight: 400
  radius: 0px
  fx: { text: kinetic }

isometric:
  label: Isometric
  about: Cards and buttons extruded into isometric blocks on a 30-degree grid.
  mode: light
  colors: { bg: "#eef2f8", bg2: "#e2e8f2", ink: "#16213a", accent: "#4f6bff", accent2: "#8fa2ff", accent_ink: "#ffffff" }
  fonts: { display: "Outfit", body: "Outfit", mono: "DM Mono" }
  display_weight: 700
  radius: 4px

clay-3d:
  label: Clay 3D
  about: Soft, puffy pastel shapes that look pressed out of modelling clay.
  mode: light
  colors: { bg: "#f3ecff", bg2: "#ebe0ff", ink: "#2d2350", accent: "#7c5cff", accent2: "#b6a3ff", accent_ink: "#ffffff" }
  fonts: { display: "Fredoka", body: "Nunito", mono: "DM Mono" }
  display_weight: 600
  radius: 32px

ascii-art:
  label: ASCII art
  about: A drifting field of characters behind the page; headlines decode letter by letter.
  mode: dark
  colors: { bg: "#050505", bg2: "#0b0b0b", ink: "#e9e9e9", accent: "#ffb000", accent2: "#ffd36b", accent_ink: "#1a1200" }
  fonts: { display: "JetBrains Mono", body: "JetBrains Mono", mono: "JetBrains Mono" }
  display_weight: 600
  radius: 0px
  fx: { bg: ascii, text: scramble }

gradient-mesh:
  label: Gradient mesh
  about: Slow, breathing fields of colour melting behind serif headlines.
  mode: light
  colors: { bg: "#fbf6f1", bg2: "#f3ebe3", ink: "#1f1530", accent: "#e8503a", accent2: "#f59a7f", accent_ink: "#ffffff" }
  fonts: { display: "Instrument Serif", body: "Manrope", mono: "DM Mono" }
  display_weight: 400
  em_italic: true
  radius: 999px

comic-book:
  label: Comic book
  about: Inked outlines, halftone dots, speech-bubble labels and a POW on the buttons.
  mode: light
  colors: { bg: "#fff7e0", bg2: "#ffe9a8", ink: "#111111", accent: "#e8202a", accent2: "#1f6fe5", accent_ink: "#ffffff" }
  fonts: { display: "Bangers", body: "Comic Neue", mono: "Space Mono" }
  display_weight: 400
  radius: 6px

split-flap:
  label: Split-flap
  about: A departures board, where numbers and headlines clatter through the alphabet before they settle.
  mode: dark
  colors: { bg: "#111214", bg2: "#18191c", ink: "#f2f2ee", accent: "#ffcc00", accent2: "#ffe066", accent_ink: "#1a1500" }
  fonts: { display: "Oswald", body: "Inter", mono: "Space Mono" }
  display_weight: 500
  radius: 4px
  fx: { text: flap }

retro-vhs:
  label: Retro VHS
  about: Scanlines, colour bleed and a tape counter; the picture wobbles when you scroll fast.
  mode: dark
  colors: { bg: "#0c0a14", bg2: "#14111f", ink: "#f4f0ff", accent: "#ff4f8b", accent2: "#5ce1ff", accent_ink: "#16020a" }
  fonts: { display: "VT323", body: "Space Mono", mono: "VT323" }
  display_weight: 400
  radius: 0px
  fx: { vhs: true }

halftone:
  label: Halftone
  about: Newsprint dot screens, duotone pictures and heavy grotesk headlines.
  mode: light
  colors: { bg: "#f4f1ea", bg2: "#e9e4d8", ink: "#141414", accent: "#0057ff", accent2: "#5b8cff", accent_ink: "#ffffff" }
  fonts: { display: "Archivo Black", body: "Archivo", mono: "Space Mono" }
  display_weight: 400
  radius: 0px

bauhaus:
  label: Bauhaus
  about: Primary colours, circles, squares and triangles, everything on the grid.
  mode: light
  colors: { bg: "#f2ede1", bg2: "#e8e1d0", ink: "#111111", accent: "#d7262b", accent2: "#1d4fc4", accent_ink: "#ffffff" }
  fonts: { display: "Josefin Sans", body: "Josefin Sans", mono: "Space Mono" }
  display_weight: 700
  radius: 0px

pixel-art:
  label: Pixel art
  about: Chunky pixel type, stepped borders and 8-bit buttons.
  mode: dark
  colors: { bg: "#1b1035", bg2: "#241548", ink: "#fff8e7", accent: "#ffd23f", accent2: "#3ee089", accent_ink: "#1b1035" }
  fonts: { display: "Press Start 2P", body: "Pixelify Sans", mono: "Pixelify Sans" }
  display_weight: 400
  radius: 0px

blueprint:
  label: Blueprint
  about: White line on cyanotype blue, a drafting grid and dimension marks around the headlines.
  mode: dark
  colors: { bg: "#0d3b78", bg2: "#0f4386", ink: "#eaf3ff", accent: "#ffffff", accent2: "#bfe0ff", accent_ink: "#0d3b78" }
  fonts: { display: "IBM Plex Sans", body: "IBM Plex Sans", mono: "IBM Plex Mono" }
  display_weight: 500
  radius: 0px

art-deco:
  label: Art deco
  about: Gold on black, sunbursts, stepped frames and tall elegant capitals.
  mode: dark
  colors: { bg: "#0d0b08", bg2: "#15120c", ink: "#f3e7c9", accent: "#d4af37", accent2: "#f0d27a", accent_ink: "#1a1406" }
  fonts: { display: "Limelight", body: "Josefin Sans", mono: "Josefin Sans" }
  display_weight: 400
  radius: 0px

neo-brutalism:
  label: Neo-brutalism
  about: Flat loud colour, thick black borders, hard shadows and buttons that press in.
  mode: light
  colors: { bg: "#ffc8e8", bg2: "#ffe14d", ink: "#000000", accent: "#00d1ff", accent2: "#7bff5c", accent_ink: "#000000" }
  fonts: { display: "Archivo Black", body: "Space Grotesk", mono: "Space Mono" }
  display_weight: 400
  radius: 8px
